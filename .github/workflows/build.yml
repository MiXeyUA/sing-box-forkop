name: Build Forkop for MSM8916

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Forkop
        run: |
          chmod +x build.sh
          ./build.sh \
            --arch aarch64_generic \
            --variant base \
            --binary-only \
            --output dist

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-forkop-msm8916-base
          path: dist/build/arm64/base/sing-box
          if-no-files-found: error
          retention-days: 14
